<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{common/layout_3block :: layout(~{::body/content()})}">
<head>
<title>ログイン | 社員管理システム</title>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>
<body>
	<th:block th:fragment="layout-main">
	<div th:object="${loginForm}">
		<h3>ログイン画面</h3>
		<!-- エラーメッセージの出力(入力チェック) -->
		<p>
			<span th:each="error:${#fields.detailedErrors()}"> 
				<span th:text="${error.message}" class="error"></span><br />
			</span>
			<span th:text="${errMessage}" class="error"></span>
		</p>
		<!-- エラーメッセージの出力(存在チェック) -->
		<div class="login_form">
			<form method="post" th:action="@{/login}">
				<div class="login_form">
				<div class="login_label">社員ID</div>
				<div class="login_input">
					<input type="text" th:field="*{empId}" th:classappend="${#fields.hasErrors('empId')}?'error_red'"/>
				</div>
				</div>
				<div class="login_form">
				<div class="login_label">パスワード</div>
				<div class="login_input pass_wrap">
					<input type="password" th:field="*{empPass}" id="loginPass" 
					th:classappend="${#fields.hasErrors('empPass')}?'error_red'"/>
					
					<label>
						<input type="checkbox" onclick="togglePassword('loginPass')">
						表示
					</label>
					
					<span class="pass_count">0/16文字</span>
				</div>
				</div>
				<div class="login_form">
				<div class="login_label"></div>
				<div class="login_input">
					<input type="submit" value="ログイン" />
				</div>
				</div>
			</form>
		</div>
	</div>
	</th:block>
	<script>
	function togglePassword(id){
	 const input=document.getElementById(id);
	 if(input.type==="password"){
		 input.type="text";
	 }else{
		 input.type="password";
	 }
 }
 </script>
 
 
 
   <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
		$(function(){
			const max_length=16;
			$('#loginPass').on('input',function(){
				const length=$(this).val().length;
				const $count=$(this).siblings('.pass_count');
				
				$count.text(length+'/'+max_length+'文字');
				
				if(length>max_length){
					$count.addClass('error');
				}else{
					$count.removeClass('error');
				}
			});
		});
	</script>
</body>
</html>
