<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    th:replace="~{common/layout_4block :: layout(~{::body/content()})}">
<head>
	<title>会員登録入力 | シェアードショップ</title>
	<meta charset="UTF-8" />
</head>
<body class="admin user_regist_input_admin">
	<h3>社員登録入力画面</h3>
	
	<div class="update">
		<form th:action="@{/regist/check}" method="post" th:object="${employeeForm}">
			<div class="form">
				<div class="label">パスワード：</div>
				<div class="input required pass_wrap">
					<input type="password" th:field="*{empPass}" id="registPass" 
					th:classappend="${#fields.hasErrors('empPass')}?'error_red'"/>
					
					<div class="error" th:if="${#fields.hasErrors('empPass')}" th:errors="*{empPass}"></div>
<!--					<span class="pass_eye" id="passEye">-->
<!--						<img class="eye-slash" src="{{asset('images/eye-slash-solid-full.svg')}}">-->
<!--						<img class="eye-solid" src="{{asset('images/eye-solid-full.svg')}}" style="display: none;">-->
<!--					</span>-->
					<span class="pass_count">0/16文字</span>
					<label>
						<input type="checkbox" onclick="togglePassword('registPass')">
						表示
					</label>
				</div>
			</div>
			
			<div class="form">
				<div class="label">社員名：</div>
 				<div class="input required">
					<input type="text" th:field="*{empName}" th:classappend="${#fields.hasErrors('empName')}?'error_red'"/>
					
					<div class="error" th:if="${#fields.hasErrors('empName')}" th:errors="*{empName}"></div>
				</div>
			</div>
			
			<div class="form">
				<div class="label">性別：</div>
				<div class="input">
					<input type="radio" th:field="*{gender}" value="1" />男性
					<input type="radio" th:field="*{gender}" value="2" />女性
				</div>
			</div>
			
			<div class="form">
				<div class="label">住所：</div>
				<div class="input required">
					<input type="text" th:field="*{address}" th:classappend="${#fields.hasErrors('address')}?'error_red'"/>
					
					<div class="error" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></div>
				</div>
			</div>
			
			<div class="form">
				<div class="label">生年月日：(YYYY/MM/DD)</div>
				<div class="input required">
					<input type="text" th:field="*{birthday}" th:classappend="${#fields.hasErrors('birthday')}?'error_red'"/>
					
					<div class="error" th:if="${#fields.hasErrors('birthday')}" th:errors="*{birthday}"></div>
				</div>
			</div>

			<div class="form">
				<div class="label">権限：</div>
				<div class="input">
					<input type="radio" th:field="*{authority}" value="1" />一般
					<input type="radio" th:field="*{authority}" value="2" />管理者
				</div>
			</div>

			<div class="form">
				<div class="label">部署名：</div>
				<div class="input">
					<select th:field="*{deptId}">
						<option value="1">営業部</option>
						<option value="2">経理部</option>
						<option value="3">総務部</option>
					</select>
				</div>
			</div>
			
			<div class="form">
				<div class="label"></div>
				<div class="input">
					<input type="submit" value="登録" />
				</div>
			</div>
		</form>
		
		<form th:action="@{/list}" name="back">
			<div class="form">
				<div class="label"></div>
				<div class="input">
					<input type="submit" value="戻る" />
				</div>
			</div>
		</form>
    </div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
		$(function(){
			const max_length=16;
			$('#registPass').on('input',function(){
				const length=$(this).val().length;
				const $count=$(this).siblings('.pass_count');
				
				$count.text(length+'/'+max_length+'文字');
				
				if(length>max_length){
					$count.addClass('error');
				}else{
					$count.removeClass('error');
				}
			});
		});
	</script>
</body>
</html>
